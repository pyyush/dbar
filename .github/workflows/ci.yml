name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run performance
      - run: npm run lint
      - run: npm run coverage

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  browser-use:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/browser-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/browser-use/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browserbase:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/browserbase
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/browserbase/package-lock.json
      - name: Build root package
        working-directory: .
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm test
