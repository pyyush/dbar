<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190">
  <rect width="800" height="190" fill="#0c0c0c" rx="6"/>
  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'SF Mono','Fira Code','Consolas',monospace" font-size="36" font-weight="700" fill="#e5e5e5" letter-spacing="5">DBAR</text>
  <text x="400" y="58" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#737373" letter-spacing="2">Deterministic Browser Agent Runtime</text>
  <!-- Diagram row -->
  <!-- Browser frame 1 -->
  <rect x="115" y="80" width="90" height="65" rx="3" fill="none" stroke="#525252" stroke-width="1.2"/>
  <circle cx="128" cy="90" r="2.5" fill="#ef4444" opacity="0.7"/>
  <circle cx="136" cy="90" r="2.5" fill="#eab308" opacity="0.7"/>
  <circle cx="144" cy="90" r="2.5" fill="#22c55e" opacity="0.7"/>
  <rect x="119" y="97" width="82" height="44" rx="1" fill="#161616"/>
  <text x="160" y="123" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#737373">capture</text>
  <!-- Arrow 1 -->
  <line x1="215" y1="112" x2="280" y2="112" stroke="#525252" stroke-width="1"/>
  <polygon points="277,108 285,112 277,116" fill="#525252"/>
  <!-- Capsule -->
  <rect x="300" y="88" width="44" height="50" rx="22" fill="none" stroke="#a3a3a3" stroke-width="1.2"/>
  <circle cx="322" cy="107" r="3" fill="#a3a3a3" opacity="0.6"/>
  <line x1="322" y1="114" x2="322" y2="128" stroke="#a3a3a3" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Arrow 2 -->
  <line x1="354" y1="112" x2="420" y2="112" stroke="#525252" stroke-width="1"/>
  <polygon points="417,108 425,112 417,116" fill="#525252"/>
  <!-- Browser frame 2 -->
  <rect x="440" y="80" width="90" height="65" rx="3" fill="none" stroke="#525252" stroke-width="1.2"/>
  <circle cx="453" cy="90" r="2.5" fill="#ef4444" opacity="0.7"/>
  <circle cx="461" cy="90" r="2.5" fill="#eab308" opacity="0.7"/>
  <circle cx="469" cy="90" r="2.5" fill="#22c55e" opacity="0.7"/>
  <rect x="444" y="97" width="82" height="44" rx="1" fill="#161616"/>
  <text x="485" y="123" text-anchor="middle" font-family="'Courier New',monospace" font-size="9" fill="#737373">replay</text>
  <!-- Arrow 3 -->
  <line x1="540" y1="112" x2="590" y2="112" stroke="#525252" stroke-width="1"/>
  <polygon points="587,108 595,112 587,116" fill="#525252"/>
  <!-- Checkmark -->
  <circle cx="620" cy="112" r="16" fill="none" stroke="#525252" stroke-width="1.2"/>
  <polyline points="611,112 616,118 630,106" fill="none" stroke="#a3a3a3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom tagline -->
  <text x="400" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#525252">Same inputs. Same outputs. Every time.</text>
</svg>
